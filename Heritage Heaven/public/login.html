<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login | Heritage Heaven</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#2B1B14;color:#F3E8D0;font-family:'Inter',sans-serif;display:flex;align-items:center;min-height:100vh;}
    .login-card{background:#3A2418;border:1px solid rgba(176,141,87,0.4);padding:3rem;max-width:450px;margin:auto;width:100%;}
    h2{font-family:'Playfair Display',serif;color:#F3E8D0;}
    .form-control{background:transparent;border:1px solid rgba(176,141,87,0.4);color:#F3E8D0;border-radius:0;}
    .form-control:focus{background:transparent;color:#F3E8D0;border-color:#B08D57;box-shadow:none;}
    .btn-gold{background:#B08D57;color:#2B1B14;border:none;padding:0.75rem;letter-spacing:0.2em;text-transform:uppercase;font-size:0.75rem;width:100%;}
    label{font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:#B08D57;}
    a{color:#B08D57;}
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="text-center mb-4">Heritage Heaven</h2>
    <p class="text-center mb-4" style="opacity:0.7;font-size:0.85rem;">Sign in to your account</p>
    <form id="loginForm">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control mt-1" required>
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input type="password" id="password" class="form-control mt-1" required>
      </div>
      <button type="submit" class="btn btn-gold mt-2">Sign In</button>
    </form>
    <p class="text-center mt-4" style="font-size:0.85rem;">
      New here? <a href="register.html">Create an account</a>
    </p>
    <p class="text-center mt-2"><a href="index.html" style="font-size:0.8rem;">← Back to home</a></p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('http://localhost:3000/api/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('hh_token', data.token);
        localStorage.setItem('hh_user', JSON.stringify(data.user));
        location.href = 'index.html';
      } else {
        alert(data.error || 'Login failed');
      }
    });
  </script>
</body>
</html>
